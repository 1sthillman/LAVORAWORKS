<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Lavora Admin Setup</title>
  <style>
    body { font-family: system-ui; padding: 40px; max-width: 600px; margin: 0 auto; }
    button { padding: 12px 24px; font-size: 16px; cursor: pointer; background: #1a73e8; color: white; border: none; border-radius: 4px; }
    button:hover { background: #1557b0; }
    button:disabled { background: #ccc; cursor: not-allowed; }
    pre { background: #f5f5f5; padding: 16px; border-radius: 4px; overflow-x: auto; }
    .success { color: #0d7c66; }
    .error { color: #d32f2f; }
  </style>
</head>
<body>
  <h1>🔐 Lavora Admin Üyelik Kaydı Oluştur</h1>
  <p>Bu sayfa, Firebase Realtime Database'de admin member kaydını oluşturur.</p>
  
  <button id="setupBtn" onclick="setupAdmin()">Admin Üyelik Kaydını Oluştur</button>
  
  <div id="output"></div>

  <script type="module">
    import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js';
    import { getAuth, signInWithPopup, GoogleAuthProvider } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js';
    import { getDatabase, ref, set, get } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js';

    const firebaseConfig = {
      apiKey: "AIzaSyAO7UomC_1wv-1lMEuDD6Z5lvzy3coZH_M",
      authDomain: "lavoradesign-49ae4.firebaseapp.com",
      databaseURL: "https://lavoradesign-49ae4-default-rtdb.firebaseio.com",
      projectId: "lavoradesign-49ae4",
      storageBucket: "lavoradesign-49ae4.firebasestorage.app",
      messagingSenderId: "646806444097",
      appId: "1:646806444097:web:b56bc52b75cd5d67ea5a82"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const database = getDatabase(app);
    const provider = new GoogleAuthProvider();

    window.setupAdmin = async function() {
      const output = document.getElementById('output');
      const btn = document.getElementById('setupBtn');
      output.innerHTML = '<p>🔄 İşlem başlatılıyor...</p>';
      btn.disabled = true;

      try {
        // 1. Google ile giriş yap
        output.innerHTML += '<p>🔐 Google ile giriş yapılıyor...</p>';
        const result = await signInWithPopup(auth, provider);
        const user = result.user;
        
        output.innerHTML += `<p class="success">✅ Giriş başarılı: ${user.email} (UID: ${user.uid})</p>`;

        // 2. Mevcut kaydı kontrol et
        const memberPath = `orgs/lavora-main/members/${user.uid}`;
        output.innerHTML += `<p>🔍 Kontrol ediliyor: /${memberPath}</p>`;
        
        const snapshot = await get(ref(database, memberPath));
        
        if (snapshot.exists()) {
          output.innerHTML += `<p class="success">✅ Admin member kaydı zaten mevcut:</p><pre>${JSON.stringify(snapshot.val(), null, 2)}</pre>`;
        } else {
          // 3. Admin member kaydını oluştur
          const memberData = {
            role: "admin",
            status: "active",
            assignedBy: "system-init",
            assignedAt: Date.now(),
            updatedAt: Date.now()
          };

          output.innerHTML += '<p>📝 Admin member kaydı oluşturuluyor...</p>';
          await set(ref(database, memberPath), memberData);
          
          output.innerHTML += `<p class="success">✅ Admin member kaydı başarıyla oluşturuldu!</p><pre>${JSON.stringify(memberData, null, 2)}</pre>`;
        }

        output.innerHTML += '<p class="success"><strong>✅ İşlem tamamlandı! Artık uygulamayı yenileyerek admin olarak çalışabilirsiniz.</strong></p>';
        
      } catch (error) {
        output.innerHTML += `<p class="error">❌ HATA: ${error.message}</p><pre>${JSON.stringify(error, null, 2)}</pre>`;
      } finally {
        btn.disabled = false;
      }
    };
  </script>
</body>
</html>
