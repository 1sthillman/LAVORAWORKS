<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <title>Lavora - Duplikasyon Testi</title>
  <style>
    body { font-family: monospace; padding: 20px; background: #1a1a1a; color: #00ff00; }
    button { padding: 12px 24px; margin: 8px; font-size: 16px; cursor: pointer; background: #00ff00; color: #000; border: none; border-radius: 4px; }
    button:hover { background: #00cc00; }
    pre { background: #000; padding: 16px; border: 2px solid #00ff00; border-radius: 4px; overflow: auto; max-height: 400px; }
    .error { color: #ff0000; }
    .success { color: #00ff00; }
    .warning { color: #ffff00; }
  </style>
</head>
<body>
  <h1>🧪 LAVORA - DUPLIKASYON TESTI</h1>
  
  <div>
    <button onclick="testLogin()">1. Google ile Giriş Test</button>
    <button onclick="testProjects()">2. Proje Sayısı Kontrol</button>
    <button onclick="testDuplication()">3. Duplikasyon Testi</button>
    <button onclick="testQueue()">4. Queue Durumu</button>
    <button onclick="testCache()">5. Cache Boyutu</button>
    <button onclick="clearAll()">🗑️ Tümünü Temizle</button>
  </div>

  <pre id="output">Test sonuçları burada görünecek...</pre>

  <script type="module">
    import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js';
    import { getAuth, signInWithPopup, GoogleAuthProvider } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js';
    import { getDatabase, ref, get } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js';

    const firebaseConfig = {
      apiKey: "AIzaSyAO7UomC_1wv-1lMEuDD6Z5lvzy3coZH_M",
      authDomain: "lavoradesign-49ae4.firebaseapp.com",
      databaseURL: "https://lavoradesign-49ae4-default-rtdb.firebaseio.com",
      projectId: "lavoradesign-49ae4"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getDatabase(app);
    
    const log = (msg, type = 'info') => {
      const output = document.getElementById('output');
      const timestamp = new Date().toLocaleTimeString('tr-TR');
      const colorClass = type === 'error' ? 'error' : type === 'success' ? 'success' : type === 'warning' ? 'warning' : '';
      output.innerHTML += `<div class="${colorClass}">[${timestamp}] ${msg}</div>`;
      output.scrollTop = output.scrollHeight;
    };

    window.testLogin = async () => {
      log('=== Google Giriş Testi ===');
      const user = auth.currentUser;
      if(user) {
        log(`✅ Zaten giriş yapılmış: ${user.email}`, 'success');
        log(`UID: ${user.uid}`, 'success');
      } else {
        log('Giriş yapılıyor...', 'warning');
        try {
          const provider = new GoogleAuthProvider();
          const result = await signInWithPopup(auth, provider);
          log(`✅ Giriş başarılı: ${result.user.email}`, 'success');
          log(`UID: ${result.user.uid}`, 'success');
        } catch(e) {
          log(`❌ Giriş hatası: ${e.message}`, 'error');
        }
      }
    };

    window.testProjects = async () => {
      log('=== Proje Sayısı Kontrolü ===');
      const user = auth.currentUser;
      if(!user) {
        log('❌ Önce giriş yapmalısınız!', 'error');
        return;
      }

      try {
        const projectsRef = ref(db, 'orgs/lavora-main/projectIndex');
        const snapshot = await get(projectsRef);
        
        if(snapshot.exists()) {
          const projects = snapshot.val();
          const projectIds = Object.keys(projects);
          const activeProjects = projectIds.filter(id => !projects[id].isTrashed);
          const trashedProjects = projectIds.filter(id => projects[id].isTrashed);
          
          log(`📊 Toplam proje: ${projectIds.length}`, 'info');
          log(`✅ Aktif proje: ${activeProjects.length}`, 'success');
          log(`🗑️ Silinmiş proje: ${trashedProjects.length}`, 'warning');
          
          // Her projenin adını listele
          activeProjects.forEach(id => {
            log(`  - ${projects[id].name} (${id.substr(0, 8)}...)`, 'info');
          });
        } else {
          log('⚠️ Hiç proje yok', 'warning');
        }
      } catch(e) {
        log(`❌ Hata: ${e.message}`, 'error');
      }
    };

    window.testDuplication = async () => {
      log('=== Duplikasyon Testi ===');
      const user = auth.currentUser;
      if(!user) {
        log('❌ Önce giriş yapmalısınız!', 'error');
        return;
      }

      try {
        const projectsRef = ref(db, 'orgs/lavora-main/projectIndex');
        const snapshot = await get(projectsRef);
        
        if(snapshot.exists()) {
          const projects = snapshot.val();
          const projectNames = Object.values(projects).map(p => p.name);
          
          // Aynı isimli projeleri bul
          const nameCounts = {};
          projectNames.forEach(name => {
            nameCounts[name] = (nameCounts[name] || 0) + 1;
          });
          
          const duplicates = Object.entries(nameCounts).filter(([name, count]) => count > 1);
          
          if(duplicates.length > 0) {
            log(`❌ DUPLIKASYON TESPİT EDİLDİ!`, 'error');
            duplicates.forEach(([name, count]) => {
              log(`  - "${name}": ${count} adet`, 'error');
            });
          } else {
            log(`✅ Duplikasyon yok - Her proje benzersiz!`, 'success');
          }
          
          // ID duplikasyonu kontrolü (olmamalı!)
          const ids = Object.keys(projects);
          const uniqueIds = [...new Set(ids)];
          if(ids.length !== uniqueIds.length) {
            log(`❌ KRİTİK: Aynı ID'ye sahip projeler var!`, 'error');
          }
        }
      } catch(e) {
        log(`❌ Hata: ${e.message}`, 'error');
      }
    };

    window.testQueue = async () => {
      log('=== Queue Durumu ===');
      
      try {
        const openRequest = indexedDB.open('lavora', 5);
        openRequest.onsuccess = (e) => {
          const db = e.target.result;
          const tx = db.transaction('cloudQueue', 'readonly');
          const store = tx.objectStore('cloudQueue');
          const getAllRequest = store.getAll();
          
          getAllRequest.onsuccess = () => {
            const queue = getAllRequest.result;
            log(`📦 Kuyrukta bekleyen işlem: ${queue.length}`, queue.length > 0 ? 'warning' : 'success');
            
            if(queue.length > 0) {
              queue.forEach((item, i) => {
                log(`  ${i+1}. ${item.kind} (${item.attempts || 0} deneme)`, 'info');
              });
            }
          };
          
          getAllRequest.onerror = () => {
            log(`❌ Queue okunamadı`, 'error');
          };
        };
        
        openRequest.onerror = () => {
          log(`❌ IndexedDB açılamadı`, 'error');
        };
      } catch(e) {
        log(`❌ Hata: ${e.message}`, 'error');
      }
    };

    window.testCache = async () => {
      log('=== Cache Boyutu ===');
      
      try {
        const estimate = await navigator.storage.estimate();
        const usedMB = (estimate.usage / 1024 / 1024).toFixed(2);
        const quotaMB = (estimate.quota / 1024 / 1024).toFixed(2);
        const percentage = ((estimate.usage / estimate.quota) * 100).toFixed(2);
        
        log(`💾 Kullanılan: ${usedMB} MB`, 'info');
        log(`💾 Kota: ${quotaMB} MB`, 'info');
        log(`📊 Doluluk: %${percentage}`, percentage > 50 ? 'warning' : 'success');
        
        if(usedMB > 50) {
          log(`⚠️ Cache çok büyük - Duplikasyon olabilir!`, 'warning');
        }
      } catch(e) {
        log(`❌ Hata: ${e.message}`, 'error');
      }
    };

    window.clearAll = async () => {
      if(!confirm('TÜM CACHE VE KUYRUK TEMİZLENECEK! Emin misiniz?')) return;
      
      log('=== Temizlik Başlıyor ===', 'warning');
      
      try {
        // IndexedDB temizle
        const deleteRequest = indexedDB.deleteDatabase('lavora');
        deleteRequest.onsuccess = () => {
          log('✅ IndexedDB temizlendi', 'success');
        };
        deleteRequest.onerror = () => {
          log('❌ IndexedDB temizlenemedi', 'error');
        };
        
        // LocalStorage temizle
        const keys = Object.keys(localStorage).filter(k => k.startsWith('lvr_'));
        keys.forEach(k => localStorage.removeItem(k));
        log(`✅ LocalStorage temizlendi (${keys.length} anahtar)`, 'success');
        
        log('Sayfa 2 saniye içinde yenilenecek...', 'warning');
        setTimeout(() => location.reload(), 2000);
      } catch(e) {
        log(`❌ Hata: ${e.message}`, 'error');
      }
    };

    log('✅ Test arayüzü hazır!', 'success');
    log('📝 Testlere başlamak için yukarıdaki butonları kullan', 'info');
  </script>
</body>
</html>
