name: Deploy HTML to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare deployment folder
        run: |
          mkdir -p _site
          # Firebase sürümünü ana sayfa yap
          cp lavora-calisma-masasi-v38-firebase.html _site/index.html
          # Ana dosyayı da doğrudan erişilebilir kıl
          cp lavora-calisma-masasi-v38-firebase.html _site/lavora-calisma-masasi-v38-firebase.html
          # Excel test dosyası
          if [ -f "01-CUBE-BK VOGER 13+3 ODA.xls" ]; then
            cp "01-CUBE-BK VOGER 13+3 ODA.xls" _site/
          fi
          echo "✅ Firebase HTML prepared for deployment"
          ls -lah _site/

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
